<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#070b17">
  <title>Mundo 3D — teste do mapa</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070b17; color: #f3f7ff; }
    body { touch-action: none; }
    #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    .top { position: fixed; z-index: 2; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    .brand, .coords { border: 1px solid rgba(100,230,255,.2); background: rgba(7,13,28,.7); backdrop-filter: blur(10px); box-shadow: 0 8px 28px #0005; border-radius: 14px; }
    .brand { padding: 10px 13px; }
    .brand strong { display: block; color: #82f1ff; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    .brand span { display: block; margin-top: 3px; color: #b8c8dc; font-size: 11px; }
    .coords { padding: 9px 12px; color: #c6d6e8; font: 11px ui-monospace, monospace; }
    .hint { position: fixed; z-index: 2; top: 76px; left: 14px; padding: 8px 11px; border-radius: 11px; color: #d6e2f4; background: rgba(7,13,28,.55); border: 1px solid rgba(255,255,255,.08); font-size: 11px; pointer-events: none; }
    .pad { position: fixed; z-index: 3; left: max(18px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); width: 142px; height: 132px; }
    .pad button { position: absolute; width: 45px; height: 45px; border: 1px solid rgba(128,238,255,.48); border-radius: 13px; color: white; font-size: 19px; background: rgba(11,24,43,.78); box-shadow: 0 6px 18px #0006; touch-action: none; user-select: none; -webkit-user-select: none; }
    .pad button:active { background: rgba(17,190,213,.7); transform: scale(.96); }
    #forward { left: 48px; top: 0; } #left { left: 0; top: 46px; } #back { left: 48px; top: 46px; } #right { left: 96px; top: 46px; }
    .drag { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(29px, env(safe-area-inset-bottom)); width: 116px; padding: 12px 10px; border: 1px solid rgba(128,238,255,.25); border-radius: 13px; text-align: center; color: #d8e4f5; background: rgba(11,24,43,.58); font-size: 10px; line-height: 1.4; pointer-events: none; }
    #error { display: none; position: fixed; inset: 20% 8%; z-index: 5; align-content: center; text-align: center; color: #fff; }
    @media (min-width: 700px) { .pad { transform: scale(1.12); transform-origin: bottom left; } .drag { width: 150px; font-size: 12px; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Mapa 3D pequeno"></canvas>
  <div class="top">
    <div class="brand"><strong>Mundo 3D</strong><span>protótipo de mapa</span></div>
    <div class="coords" id="coords">X 0.0&nbsp;&nbsp; Z 0.0</div>
  </div>
  <div class="hint">Você já entrou no mapa. Sem login.</div>
  <div class="pad" aria-label="Controles de movimento">
    <button id="forward" data-key="w" aria-label="Para frente">▲</button>
    <button id="left" data-key="a" aria-label="Para esquerda">◀</button>
    <button id="back" data-key="s" aria-label="Para trás">▼</button>
    <button id="right" data-key="d" aria-label="Para direita">▶</button>
  </div>
  <div class="drag">Arraste a tela para girar a câmera<br>W A S D ou setas para andar</div>
  <div id="error">Este navegador não conseguiu iniciar o 3D WebGL.<br>Teste novamente em um navegador atualizado.</div>
  <script src="/vendor/three.min.js"></script>
  <script>
    (() => {
      const canvas = document.querySelector('#scene');
      const errorBox = document.querySelector('#error');
      if (!window.THREE) { errorBox.style.display = 'grid'; errorBox.textContent = 'Não foi possível carregar o motor 3D.'; return; }
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      } catch (e) {
        errorBox.style.display = 'grid';
        return;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070b17);
      scene.fog = new THREE.Fog(0x070b17, 15, 35);
      const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 80);
      const hemi = new THREE.HemisphereLight(0xb7eaff, 0x11192b, 1.8);
      scene.add(hemi);
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
      keyLight.position.set(-4, 8, 5);
      scene.add(keyLight);
      const cyanLight = new THREE.PointLight(0x1bdcff, 2.4, 16);
      cyanLight.position.set(0, 3.5, 0);
      scene.add(cyanLight);

      // Uma única plataforma pequena: 10 x 10 unidades.
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({ color: 0x162236, roughness: 0.84, metalness: 0.12 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.025;
      scene.add(floor);

      const grid = new THREE.GridHelper(10, 10, 0x36dff5, 0x263b55);
      grid.position.y = 0.006;
      scene.add(grid);

      const edgePoints = [
        new THREE.Vector3(-5, .025, -5), new THREE.Vector3(5, .025, -5),
        new THREE.Vector3(5, .025, -5), new THREE.Vector3(5, .025, 5),
        new THREE.Vector3(5, .025, 5), new THREE.Vector3(-5, .025, 5),
        new THREE.Vector3(-5, .025, 5), new THREE.Vector3(-5, .025, -5)
      ];
      const edgeGeo = new THREE.BufferGeometry().setFromPoints(edgePoints);
      scene.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0x52edff })));

      // Boneco de demonstração simples para confirmar que o jogador aparece no cenário.
      const player = new THREE.Group();
      const suit = new THREE.MeshStandardMaterial({ color: 0x21c9e7, roughness: .42, metalness: .18 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x102238, roughness: .72 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(.22, .27, .56, 12), suit);
      body.position.y = .62;
      player.add(body);
      const shoulders = new THREE.Mesh(new THREE.SphereGeometry(.22, 12, 10), suit);
      shoulders.position.y = .88;
      player.add(shoulders);
      const head = new THREE.Mesh(new THREE.SphereGeometry(.19, 16, 12), new THREE.MeshStandardMaterial({ color: 0xe4c4a8, roughness: .8 }));
      head.position.y = 1.22;
      player.add(head);
      const visor = new THREE.Mesh(new THREE.BoxGeometry(.22, .07, .035), dark);
      visor.position.set(0, 1.24, .17);
      player.add(visor);
      const legGeo = new THREE.CylinderGeometry(.075, .09, .32, 8);
      const leftLeg = new THREE.Mesh(legGeo, dark); leftLeg.position.set(-.105, .16, 0); player.add(leftLeg);
      const rightLeg = new THREE.Mesh(legGeo, dark); rightLeg.position.set(.105, .16, 0); player.add(rightLeg);
      const shadow = new THREE.Mesh(new THREE.CircleGeometry(.42, 24), new THREE.MeshBasicMaterial({ color: 0x020611, transparent: true, opacity: .55 }));
      shadow.rotation.x = -Math.PI / 2; shadow.position.y = .018; player.add(shadow);
      scene.add(player);

      const keys = new Set();
      let yaw = 0;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      const coords = document.querySelector('#coords');
      const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

      window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) { keys.add(k); e.preventDefault(); }
      });
      window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
      window.addEventListener('blur', () => keys.clear());
      document.querySelectorAll('.pad button').forEach(button => {
        const down = e => { e.preventDefault(); keys.add(button.dataset.key); button.setPointerCapture?.(e.pointerId); };
        const up = e => { e.preventDefault(); keys.delete(button.dataset.key); };
        button.addEventListener('pointerdown', down);
        button.addEventListener('pointerup', up);
        button.addEventListener('pointercancel', up);
        button.addEventListener('lostpointercapture', up);
      });
      canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
      canvas.addEventListener('pointermove', e => {
        if (!dragging) return;
        yaw -= (e.clientX - lastX) * .006;
        lastX = e.clientX; lastY = e.clientY;
      });
      const stopDrag = () => { dragging = false; };
      canvas.addEventListener('pointerup', stopDrag);
      canvas.addEventListener('pointercancel', stopDrag);

      function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener('resize', resize);
      resize();

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), .04);
        const forward = keys.has('w') || keys.has('arrowup');
        const backward = keys.has('s') || keys.has('arrowdown');
        const left = keys.has('a') || keys.has('arrowleft');
        const right = keys.has('d') || keys.has('arrowright');
        let mx = 0, mz = 0;
        if (forward) { mx += Math.sin(yaw); mz += Math.cos(yaw); }
        if (backward) { mx -= Math.sin(yaw); mz -= Math.cos(yaw); }
        if (left) { mx -= Math.cos(yaw); mz += Math.sin(yaw); }
        if (right) { mx += Math.cos(yaw); mz -= Math.sin(yaw); }
        const length = Math.hypot(mx, mz);
        if (length > 0) {
          mx /= length; mz /= length;
          player.position.x = clamp(player.position.x + mx * 2.4 * dt, -4.35, 4.35);
          player.position.z = clamp(player.position.z + mz * 2.4 * dt, -4.35, 4.35);
          player.rotation.y = Math.atan2(mx, mz);
        }
        const target = new THREE.Vector3(player.position.x, 1.15, player.position.z);
        const distance = 5.8;
        const wanted = new THREE.Vector3(
          player.position.x - Math.sin(yaw) * distance,
          player.position.y + 3.4,
          player.position.z - Math.cos(yaw) * distance
        );
        camera.position.lerp(wanted, .12);
        camera.lookAt(target);
        coords.textContent = `X ${player.position.x.toFixed(1)}   Z ${player.position.z.toFixed(1)}`;
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
</html>
